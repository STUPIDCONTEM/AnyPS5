name: Linux lstat birthtime verification

on:
  push:
    branches:
      - ci/birthtime-lstat-compat

permissions:
  contents: read

jobs:
  guest-filesystem:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - name: Install Vulkan loader used by the project build
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvulkan1 mesa-vulkan-drivers

      - name: Configure focused Release build
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DANYPS5_ENABLE_SPIRV_TOOLS=OFF

      - name: Confirm the pre-bridge baseline fails on symlink birthtime
        shell: bash
        run: |
          set -euo pipefail
          source_file=core/libs/prx/libkernel/File/src/NativeStat.cpp
          trap 'git show "$GITHUB_SHA:$source_file" > "$source_file"; touch "$source_file"' EXIT
          git show d7bd5084:"$source_file" > "$source_file"
          touch "$source_file"
          cmake --build build --target guest_filesystem_tests --parallel 3

          set +e
          ctest --test-dir build --output-on-failure --timeout 30 -R '^guest_filesystem$' > baseline-ctest.log 2>&1
          status=$?
          set -e
          cat baseline-ctest.log
          if [[ $status -eq 0 ]]; then
            echo 'Expected pre-bridge baseline guest_filesystem to fail, but it passed.' >&2
            exit 1
          fi
          grep -F 'Linux birthtime regression: symlink lstat did not match native STATX_BTIME' baseline-ctest.log

      - name: Rebuild candidate and require repeated success
        shell: bash
        run: |
          set -euo pipefail
          source_file=core/libs/prx/libkernel/File/src/NativeStat.cpp
          git show "$GITHUB_SHA:$source_file" > "$source_file"
          touch "$source_file"
          cmake --build build --target guest_filesystem_tests --parallel 3
          ctest --test-dir build --output-on-failure --timeout 30 --repeat until-fail:3 -R '^guest_filesystem$'
