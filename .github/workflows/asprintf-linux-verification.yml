name: asprintf Linux error mapping

on:
  push:
    branches:
      - ci/asprintf-error-verification

permissions:
  contents: read

jobs:
  guest-formatting:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 3

      - name: Install Vulkan loader used by the project build
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvulkan1 mesa-vulkan-drivers

      - name: Configure focused Release build
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DANYPS5_ENABLE_SPIRV_TOOLS=OFF

      - name: Confirm the regression fails against main
        shell: bash
        run: |
          set -euo pipefail
          source_file=core/libs/prx/libc/src/AllocatingStrings.cpp
          trap 'git show "$GITHUB_SHA:$source_file" > "$source_file"' EXIT
          git show a8b032b236030abb49de1d569e68d7f5a1117a22:"$source_file" > "$source_file"
          cmake --build build --target guest_formatting_tests --parallel 3

          set +e
          ctest --test-dir build --output-on-failure --timeout 30 -R '^guest_formatting$' > baseline-ctest.log 2>&1
          status=$?
          set -e
          cat baseline-ctest.log
          if [[ $status -eq 0 ]]; then
            echo 'Expected baseline guest_formatting to fail, but it passed.' >&2
            exit 1
          fi
          grep -F 'asprintf EILSEQ regression: expected guest errno 86, got 84' baseline-ctest.log

      - name: Rebuild candidate and require repeated success
        shell: bash
        run: |
          set -euo pipefail
          source_file=core/libs/prx/libc/src/AllocatingStrings.cpp
          git show "$GITHUB_SHA:$source_file" > "$source_file"
          cmake --build build --target guest_formatting_tests --parallel 3
          ctest --test-dir build --output-on-failure --timeout 30 --repeat until-fail:3 -R '^guest_formatting$'